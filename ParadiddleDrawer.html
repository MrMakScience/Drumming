<title>Paradiddle Drawer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
  /* Layout: one centered column. Two drum heads carry the answer, the controls sit directly beneath. */
  :root {
    --ground: #E8EDF0;
    --surface: #FFFFFF;
    --ink: #121C26;
    --muted: #4A5866;
    --line: #5F6D7A;
    --line-soft: #B9C4CC;
    --hoop: #9AA7B2;
    --accent: #B3261E;
    --on-accent: #FFFFFF;
    --notice-bg: #FDECEA;
    --focus: #0B57D0;
    --font-display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F151B;
      --surface: #19222B;
      --ink: #EAF0F4;
      --muted: #A9B6C2;
      --line: #8795A1;
      --line-soft: #34424E;
      --hoop: #4A5A67;
      --accent: #FF8F85;
      --on-accent: #240705;
      --notice-bg: #2B1A1A;
      --focus: #8AB4F8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F151B;
    --surface: #19222B;
    --ink: #EAF0F4;
    --muted: #A9B6C2;
    --line: #8795A1;
    --line-soft: #34424E;
    --hoop: #4A5A67;
    --accent: #FF8F85;
    --on-accent: #240705;
    --notice-bg: #2B1A1A;
    --focus: #8AB4F8;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 1rem/1.5 var(--font-body);
    min-height: 100%;
  }
  .wrap {
    width: 100%;
    max-width: 38rem;
    margin-inline: auto;
    padding-inline: 16px;
    padding-block: 28px 44px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  h1 {
    margin: 0;
    font: 800 clamp(2.4rem, 9vw, 3.4rem)/0.95 var(--font-display);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .intro { margin: 8px 0 0; max-width: 34ch; color: var(--muted); }

  .heads { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .head {
    width: 100%;
    max-width: 13rem;
    margin-inline: auto;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--surface);
    border: clamp(5px, 1.6vw, 9px) solid var(--hoop);
    box-shadow: inset 0 0 0 2px var(--ground), inset 0 0 0 3px var(--line-soft);
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 2px;
    min-width: 0;
  }
  .head .lab {
    font: 600 clamp(0.8rem, 3.2vw, 1rem)/1 var(--font-mono);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 0.2em;
  }
  .head .num {
    font: 800 clamp(4.6rem, 24vw, 8.2rem)/0.9 var(--font-display);
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .head.pop .num { animation: pop 260ms ease-out; }
  @keyframes pop { from { transform: scale(0.82); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }

  .pulse { display: flex; justify-content: center; gap: 8px; }
  .pulse i {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--line);
    background: transparent;
    display: block;
  }
  .pulse i:nth-child(4) { margin-right: 10px; }
  .pulse i.on { background: var(--accent); border-color: var(--accent); }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button, .check, input[type="range"] { font-family: var(--font-body); }
  .btn {
    min-height: 56px;
    padding: 10px 14px;
    border-radius: 6px;
    border: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-size: 1.125rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .btn svg { width: 22px; height: 22px; flex: none; fill: currentColor; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn:active { transform: translateY(1px); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .panel {
    display: grid;
    gap: 6px;
    padding-top: 20px;
    border-top: 2px solid var(--line-soft);
  }
  .tempo-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .tempo-row label { font-weight: 600; }
  output { font: 600 1rem var(--font-mono); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; height: 44px; margin: 0; accent-color: var(--accent); background: transparent; }
  .check { display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 600; cursor: pointer; }
  .check input { width: 24px; height: 24px; margin: 0; accent-color: var(--accent); flex: none; }

  .status {
    margin: 0;
    padding: 12px 16px;
    border-radius: 6px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
  }
  .notice {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 14px 16px;
    background: var(--notice-bg);
    border: 2px solid var(--accent);
    border-radius: 6px;
  }
  .notice svg { width: 28px; height: 28px; flex: none; fill: var(--accent); margin-top: 2px; }
  .notice > div { min-width: 0; }
  .notice p { margin: 0; }
  .notice-title { font-weight: 700; font-size: 1.0625rem; line-height: 1.3; }
  .notice-body { margin-top: 4px; font-size: 1rem; }
  .notice-body strong { color: var(--accent); }
  .sr {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .head.pop .num { animation: none; }
    .btn:active { transform: none; }
  }
</style>

<main class="wrap">
  <header>
    <h1>Paradiddle Drawer</h1>
    <p class="intro">Draw a Front and an End. Sing the form out loud, then press Play and listen.</p>
  </header>

  <section aria-label="Current draw">
    <div class="heads">
      <div class="head" id="headFront"><span class="lab">Front</span><span class="num" id="numFront">1</span></div>
      <div class="head" id="headEnd"><span class="lab">End</span><span class="num" id="numEnd">1</span></div>
    </div>
    <p class="sr" id="live" aria-live="polite"></p>
  </section>

  <div class="pulse" aria-hidden="true" id="pulse">
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
  </div>

  <div class="actions">
    <button type="button" class="btn" id="drawBtn">
      <svg viewbox="0 0 24 24" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm3 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm8 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm-8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm8-7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>
      <span>Draw</span>
    </button>
    <button type="button" class="btn primary" id="playBtn">
      <svg viewbox="0 0 24 24" aria-hidden="true" id="playIcon"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5Z"/></svg>
      <span id="playLabel">Play</span>
    </button>
  </div>

  <p class="status" id="status" role="status" hidden=""></p>

  <aside class="notice" role="note" aria-labelledby="noticeTitle">
    <svg viewbox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3Zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-9v2.1a7 7 0 0 1 0 13.8V21a9 9 0 0 0 0-18Z"/></svg>
    <div>
      <p class="notice-title" id="noticeTitle">No sound, or the sound suddenly stopped?</p>
      <p class="notice-body"><strong>Refresh the page</strong>, then press Play again. On an iPhone or iPad, also raise the volume and check the silent switch.</p>
    </div>
  </aside>

  <div class="panel">
    <div class="tempo-row">
      <label for="tempo">Tempo</label>
      <output id="tempoOut" for="tempo">80 BPM</output>
    </div>
    <input type="range" id="tempo" min="50" max="140" step="5" value="80" aria-valuetext="80 beats per minute">
    <label class="check" for="loop"><input type="checkbox" id="loop" checked=""><span>Repeat until I press Stop</span></label>
  </div>

</main>

<script>
(function () {
  "use strict";

  /* Sticking tables. R = bass drum, L = ghost note, except the fifth stroke, which is a rimshot snare. */
  var FRONTS = ["RLRR", "RLLR", "RRLR", "RLRL"];
  var ENDS = ["LRLL", "LRRL", "LLRL", "LRLR"];

  function typesFor(f, e) {
    var s = FRONTS[f] + ENDS[e];
    var out = [];
    for (var i = 0; i < s.length; i++) {
      out.push(s.charAt(i) === "R" ? "bass" : (i === 4 ? "snare" : "ghost"));
    }
    return out;
  }

  var $ = function (id) { return document.getElementById(id); };
  var numFront = $("numFront"), numEnd = $("numEnd"), live = $("live");
  var playBtn = $("playBtn"), playLabel = $("playLabel"), playIcon = $("playIcon");
  var tempo = $("tempo"), tempoOut = $("tempoOut"), loopEl = $("loop");
  var statusEl = $("status");
  var dots = $("pulse").children;

  var PLAY_PATH = "M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5Z";
  var STOP_PATH = "M6 5h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z";

    numEnd.textContent = String(e + 1);
    live.textContent = "Front " + (f + 1) + ", End " + (e + 1);
    if (animate) {

        var el = $(id);
        el.classList.remove("pop");
        void el.offsetWidth;
        el.classList.add("pop");
      });
    }
  }

  function draw() {
    stop();
    var f, e;
    do { f = rand(4); e = rand(4); } while (current && f === current.f && e === current.e);
    current = { f: f, e: e };
    show(f, e, true);
  }

    if (ctx) { return ctx; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { return null; }

    comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.15;

    for (var s = 0; s < 1024; s++) { satCurve[s] = Math.tanh(2.2 * (s / 512 - 1)); }

    var s = c.createBufferSource();
    s.buffer = noiseBuf;
    s.start(t, Math.random() * 0.5);
    s.stop(t + dur);
    return s;
  }
  function env(c, t, peak, dur, attack) {
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + (attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0005, t + dur);

  }
  function tone(c, out, t, type, f0, f1, fdur, peak, dur) {
    var o = c.createOscillator(), g = env(c, t, peak, dur);
    o.type = type;
    o.frequency.setValueAtTime(f0, t);

    /* Bass drum: pitch-dropping skin tone, a low sub, a wooden knock and a beater click.

      sh.connect(out);

      tone(c, sh, t, "sine", 62, 42, 0.2, 0.5 * v, 0.38);

      hit(c, out, t, "bandpass", 3800, 1.1, 0.28 * v, 0.018);
      hit(c, out, t, "lowpass", 600, 0.7, 0.2 * v, 0.08);

      hit(c, out, t, "bandpass", 3000, 0.6, 0.18 * v, 0.075);
      hit(c, out, t, "highpass", 2000, 0.7, 0.1 * v, 0.05);

      tone(c, out, t, "triangle", 330, 260, 0.03, 0.55 * v, 0.14);
      tone(c, out, t, "sine", 185, 160, 0.04, 0.55 * v, 0.16);
      hit(c, out, t, "highpass", 1400, 0.7, 0.8 * v, 0.22);
      hit(c, out, t, "bandpass", 5200, 0.9, 0.5 * v, 0.3);
      hit(c, out, t, "bandpass", 1800, 3, 0.55 * v, 0.03);
      tone(c, out, t, "square", 1000, 650, 0.012, 0.18 * v, 0.025);
      tone(c, out, t, "sine", 2300, 0, 0, 0.12 * v, 0.02);
    }
  };

  function bpm() { return parseInt(tempo.value, 10) || 80; }

  function setButton(isPlaying) {
    playLabel.textContent = isPlaying ? "Stop" : "Play";
    playIcon.firstElementChild.setAttribute("d", isPlaying ? STOP_PATH : PLAY_PATH);
  }
  function clearDots() { for (var i = 0; i < dots.length; i++) { dots[i].classList.remove("on"); } }

    stop();

    statusEl.hidden = false;
  }

    bus.connect(master);
    bus.connect(reverbIn);
    playing = true;
    setButton(true);

  }

    if (bus && ctx) {
      var b = bus;
      try { b.gain.cancelScheduledValues(0); b.gain.setTargetAtTime(0, ctx.currentTime, 0.01); } catch (err) {}
      setTimeout(function () { try { b.disconnect(); } catch (err) {} }, 120);
    }
    bus = null;
    playing = false;
    if (keepAlive) { keepAlive.pause(); }
    clearDots();
    setButton(false);
  }

  /* ---------- Wiring ---------- */
  $("drawBtn").addEventListener("click", draw);
  playBtn.addEventListener("click", function () { if (playing) { stop(); } else { start(); } });
  tempo.addEventListener("input", function () {
    tempoOut.textContent = bpm() + " BPM";
    tempo.setAttribute("aria-valuetext", bpm() + " beats per minute");
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden && playing) { stop(); } });

  current = { f: rand(4), e: rand(4) };
  show(current.f, current.e, false);
})();
</script>

</body></html>
